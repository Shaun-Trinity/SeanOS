<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sean Sesing – Video Editor Portfolio</title>
  <meta name="description" content="Sean Sesing — short-form video editor, color grader and creative director based in Johannesburg.">
  <meta property="og:title" content="Sean Sesing – Video Editor Portfolio">
  <meta property="og:description" content="Short and long form video for brands, creators and campaigns.">
  <meta property="og:image" content="https://i.ytimg.com/vi/g_2KfJXox1E/maxresdefault.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Boot screen: shown once per browser session, removed by app.js -->
  <div id="boot" aria-hidden="true">
    <div class="boot-logo"></div>
    <div class="boot-bar"><i></i></div>
  </div>

  <header id="menubar">
    <nav class="menu-left" aria-label="Main menu">
      <button class="menu-item menu-logo" data-menu="about" aria-label="About SeanOS">
        <svg class="logo-seanos" viewBox="0 0 754 1136" aria-hidden="true"><g transform="matrix(1,0,0,1,-2963.32125,-389.850192)"><g transform="matrix(4.166667,0,0,4.166667,2262,0)"><g transform="matrix(1.739946,0,0,1.739946,293.993375,261.44645)"><path d="M0,-36.859L-6.787,-30.674L7.842,-14.621C22.402,1.357 21.248,26.203 5.27,40.763C-2.471,47.817 -12.515,51.434 -22.954,50.948C-33.415,50.462 -43.061,45.932 -50.114,38.191L-59.26,28.155L-49.069,18.869L-40.476,28.299C-35.902,33.317 -29.649,36.254 -22.867,36.569C-22.464,36.587 -22.062,36.597 -21.661,36.597C-15.318,36.597 -9.288,34.266 -4.569,29.966C0.449,25.393 3.387,19.14 3.701,12.357C4.017,5.576 1.671,-0.923 -2.901,-5.941L-16.902,-21.305L-16.931,-21.28L-30.852,-36.557C-33.772,-39.762 -35.271,-43.914 -35.069,-48.245C-34.868,-52.577 -32.992,-56.571 -29.786,-59.493C-26.582,-62.413 -22.438,-63.907 -18.099,-63.711C-13.767,-63.509 -9.772,-61.633 -6.852,-58.428L1.742,-48.998L1.688,-48.949L7.872,-42.162L31.69,-63.866L16.36,-80.69C7.655,-90.243 -4.249,-95.834 -17.16,-96.434C-30.061,-97.032 -42.442,-92.568 -51.995,-83.863C-61.549,-75.158 -67.14,-63.254 -67.739,-50.343C-68.339,-37.432 -63.874,-25.061 -55.169,-15.508L-40.541,0.545L-33.754,-5.639L-48.382,-21.692C-55.436,-29.433 -59.053,-39.456 -58.567,-49.917C-58.081,-60.378 -53.551,-70.023 -45.812,-77.076C-38.07,-84.13 -28.048,-87.744 -17.586,-87.261C-7.125,-86.776 2.521,-82.246 9.573,-74.505L18.72,-64.469L8.529,-55.182L-0.064,-64.612C-4.638,-69.63 -10.891,-72.567 -17.673,-72.882C-24.453,-73.199 -30.953,-70.852 -35.971,-66.279C-40.989,-61.707 -43.927,-55.453 -44.241,-48.671C-44.557,-41.889 -42.211,-35.391 -37.639,-30.373L-23.639,-15.008L-23.61,-15.034L-9.688,0.244C-6.768,3.449 -5.27,7.6 -5.471,11.932C-5.672,16.264 -7.548,20.258 -10.753,23.179C-13.959,26.099 -18.114,27.598 -22.441,27.397C-26.773,27.196 -30.768,25.32 -33.688,22.114L-42.282,12.684L-42.229,12.635L-48.412,5.848L-72.23,27.553L-56.901,44.376C-48.195,53.929 -36.291,59.52 -23.381,60.12C-22.612,60.156 -21.847,60.173 -21.083,60.173C-9.009,60.173 2.47,55.737 11.454,47.55C31.175,29.579 32.599,-1.085 14.629,-20.806L0,-36.859Z" fill="currentColor"/></g></g></g></svg>
      </button>
      <span class="menu-item menu-brand">SeanOS</span>
      <button class="menu-item" data-menu="about">About</button>
      <button class="menu-item" data-menu="cv">CV</button>
      <button class="menu-item" data-menu="contact">Contact</button>
    </nav>
    <div class="menu-right">
      <button class="menu-item" id="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false">
        <svg class="i-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.6A7 7 0 0 1 7.4 3.5a7 7 0 1 0 9.1 9.1z" fill="currentColor"/></svg>
        <svg class="i-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="currentColor"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4"/></g></svg>
      </button>
      <button class="menu-item" id="cc-toggle" aria-label="Control Center" aria-expanded="false" aria-controls="control-center">
        <svg viewBox="0 0 20 20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="16" height="6" rx="3"/><rect x="2" y="11" width="16" height="6" rx="3"/></g><circle cx="6" cy="6" r="1.8" fill="currentColor"/><circle cx="14" cy="14" r="1.8" fill="currentColor"/></svg>
      </button>
      <time class="menu-item menu-clock" id="clock"></time>
    </div>
  </header>

  <!-- Control Center: opened from the menu bar; room for widgets later -->
  <div id="control-center" role="dialog" aria-label="Control Center" hidden>
    <div class="cc-glass" aria-hidden="true"></div>
    <div class="cc-content">
      <section class="cc-tile">
        <div class="cc-head"><label for="glass-slider">Transparency</label><output id="glass-value" for="glass-slider">50%</output></div>
        <div class="cc-slider-wrap">
          <span class="cc-fill" aria-hidden="true"></span>
          <input type="range" class="cc-slider" id="glass-slider" min="0" max="100" step="1" value="50">
        </div>
      </section>
    </div>
  </div>

  <!-- Lens filter for the Control Center glass; app.js draws the displacement map to fit the panel -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="cc-lens" x="0" y="0" width="100%" height="100%" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feImage id="cc-lens-map" x="0" y="0" result="map" preserveAspectRatio="none"/>
      <feDisplacementMap in="SourceGraphic" in2="map" scale="0" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <main id="desktop" aria-label="Desktop">
    <div id="icons" role="list"></div>

    <!-- Desktop widgets (filled in by app.js) -->
    <aside id="widgets" aria-label="Widgets">
      <a class="widget widget-cal" id="widget-cal" target="_blank" rel="noopener"></a>
      <div class="widget widget-clock" id="widget-clock" role="img"></div>
    </aside>
  </main>

  <!-- Desktop right-click menu -->
  <div id="ctx-menu" role="menu" hidden>
    <button role="menuitem" data-action="cleanup">Clean Up</button>
  </div>

  <nav id="dock" aria-label="Dock">
    <a class="dock-item" href="https://www.blackmagicdesign.com/products/davinciresolve" target="_blank" rel="noopener" data-tip="DaVinci Resolve">
      <span class="dock-icon resolve" aria-hidden="true"><img src="assets/icons/davinciresolve.png" alt=""></span>
    </a>
    <a class="dock-item" href="https://www.capcut.com/" target="_blank" rel="noopener" data-tip="CapCut">
      <span class="dock-icon capcut" aria-hidden="true"><img src="assets/icons/capcut.svg" alt=""></span>
    </a>
    <a class="dock-item" href="https://www.canva.com/" target="_blank" rel="noopener" data-tip="Canva">
      <span class="dock-icon canva" aria-hidden="true"><img src="assets/icons/canva.jpg" alt=""></span>
    </a>
    <span class="dock-sep"></span>
    <button class="dock-item" data-open="notes" data-tip="About me">
      <span class="dock-icon notes" aria-hidden="true"><img src="assets/icons/notes.svg" alt=""></span>
    </button>
    <button class="dock-item" data-open="mail" data-tip="Contact">
      <span class="dock-icon mail" aria-hidden="true"><img src="assets/icons/mail.svg" alt=""></span>
    </button>
    <span class="dock-sep"></span>
    <a class="dock-item" id="dock-linkedin" target="_blank" rel="noopener" data-tip="LinkedIn">
      <span class="dock-icon linkedin" aria-hidden="true"><img src="assets/icons/linkedin.svg" alt=""></span>
    </a>
  </nav>

  <template id="tpl-window">
    <section class="window" role="dialog">
      <header class="titlebar">
        <div class="lights">
          <button class="light close" aria-label="Close"></button>
          <button class="light min" aria-label="Minimize"></button>
          <button class="light max" aria-label="Zoom"></button>
        </div>
        <h2 class="title"></h2>
      </header>
      <div class="content"></div>
    </section>
  </template>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
